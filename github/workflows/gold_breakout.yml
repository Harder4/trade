name: Gold Breakout Bot (V2)

on:
  schedule:
    - cron: '3 7-17 * * 1-5'
  workflow_dispatch:

jobs:
  run-gold-breakout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy matplotlib requests

      - name: Run Gold Breakout V2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLD_BREAKOUT_CHAT_ID: ${{ secrets.GOLD_BREAKOUT_CHAT_ID }}
        run: python gold_breakout_bot.py
