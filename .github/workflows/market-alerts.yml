name: Market alerts (FX, gold, oil)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "للاستكشاف فقط، مثال: --list commodities oil (اتركه فارغاً للتشغيل العادي)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARGS: ${{ github.event.inputs.args }}
        run: python market_alerts.py $ARGS
      - name: Save state
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add state/market.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase origin main
            git push
          fi
